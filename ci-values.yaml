#todo test idam-pr
tags:
  idam-pr: false

ingressHost: chart-hmc-release.service.core-compute-preview.internal
ingressIP: "10.97.17.51"
consulIP: "10.97.11.254"

readinessDelay: 90
livenessDelay: 90

global:
  subscriptionId: "8b6ea922-0862-443e-af15-6056e1c9b9a4"
  tenantId: "531ff96d-0ae9-462a-8d2d-bec7c0b42082"
  idamApiUrl: https://idam-api.aat.platform.hmcts.net
  idamWebUrl: https://idam-web-public.aat.platform.hmcts.net
  environment: aat
  devMode: true

hmc-hmi-inbound-adapter:
  java:
    secrets:
      HMC_SERVICE_BUS_CONNECTION_STRING:
        secretRef: servicebus-access
        key: connectionString
      HMC_QUEUE_CONNECTION_STRING:
        secretRef: servicebus-access
        key: connectionString
      HMC_OUTBOUND_QUEUE_CONNECTION_STRING:
        secretRef: servicebus-access
        key: connectionString
    environment:
      HMC_SERVICE_BUS_QUEUE: chart-hmc-ci-test-servicebus-hmc-from-hmi

hmc-hmi-outbound-adapter:
  java:
    secrets:
      HMC_SERVICE_BUS_OUTBOUND_CONNECTION_STRING:
        secretRef: servicebus-access
        key: connectionString
      HMC_SERVICE_BUS_INBOUND_CONNECTION_STRING:
        secretRef: servicebus-access
        key: connectionString
    environment:
      HMC_SERVICE_BUS_OUTBOUND_QUEUE: chart-hmc-ci-test-servicebus-hmc-to-hmi
      HMC_SERVICE_BUS_INBOUND_QUEUE: chart-hmc-ci-test-servicebus-hmc-from-hmi

hmc-cft-hearing-service:
  java:
    secrets:
      HMC_SERVICE_BUS_CONNECTION_STRING:
        secretRef: servicebus-access
        key: connectionString
      HMC_QUEUE_CONNECTION_STRING:
        secretRef: servicebus-access
        key: connectionString
      HMC_OUTBOUND_QUEUE_CONNECTION_STRING:
        secretRef: servicebus-access
        key: connectionString
    environment:
      HMC_SERVICE_BUS_TOPIC: chart-hmc-ci-test-servicebus-hmc-to-cft
      HMC_SERVICE_BUS_SUBSCRIPTION: chart-hmc-ci-test-servicebus-hmc-subs-to-cft
      HMC_SERVICE_BUS_QUEUE: chart-hmc-ci-test-servicebus-hmc-from-hmi
      HMC_OUTBOUND_SERVICE_BUS_QUEUE: chart-hmc-ci-test-servicebus-hmc-to-hmi

servicebus:
  enabled: true
  tags:
    teamName: "CDM"
    applicationName: "core-case-data"
    builtFrom: "https://github.com/hmcts/chart-hmc"
    businessArea: "CFT"
    environment: "development"
  sbNamespace: chart-tests-servicebus
  resourceGroup: chart-tests-aso-preview-rg
  serviceplan: standard
  setup:
    topics:
      - name: hmc-to-cft
    subscriptions:
      - name: hmc-subs-to-cft
    queues:
      - name: hmc-from-hmi
      - name: hmc-to-hmi